{{- with .Values.deployment }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: {{ $.Values.global.labelsValue }}
spec:
  replicas: {{ .replicas }}
  selector:
    matchLabels:
      app: {{ $.Values.global.labelsValue }}
  template:
    metadata:
      labels:
        app: {{ $.Values.global.labelsValue }}
    spec:
      containers:
      - name: {{ .containerName }}
        image: {{ .image }}
        ports:
        - containerPort: {{ $.Values.global.port }}
{{- end }}

